spring:
  application:
    name: ArticlePilot
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ArticlePilot}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=${DB_SSL:false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 30000
  mybatis-flex:
    configuration:
      map-underscore-to-camel-case: false
  session:
    store-type: redis
    timeout: 30d
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}

server:
  port: ${SERVER_PORT:8567}
  forward-headers-strategy: framework
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 30d
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: github.comioko.articlepilot.controller

knife4j:
  enable: ${API_DOCS_ENABLED:true}
  setting:
    language: zh_cn

tencent:
  cos:
    secret-id: ${TENCENT_COS_SECRET_ID:}
    secret-key: ${TENCENT_COS_SECRET_KEY:}
    region: ${TENCENT_COS_REGION:ap-guangzhou}
    bucket: ${TENCENT_COS_BUCKET:}

pexels:
  api-key: ${PEXELS_API_KEY:}

nano-banana:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3-pro-image-preview}

stripe:
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  success-url: ${PUBLIC_BASE_URL:http://localhost:5173}/vip?success=true
  cancel-url: ${PUBLIC_BASE_URL:http://localhost:5173}/vip?cancelled=true

mermaid:
  puppeteer-config: ${MERMAID_PUPPETEER_CONFIG:}

article:
  agent:
    orchestrator:
      enabled: ${ARTICLE_AGENT_ENABLED:true}
    max-iterations: ${ARTICLE_AGENT_MAX_ITERATIONS:10}
